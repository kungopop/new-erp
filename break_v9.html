<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير البريكات</title>
<style>*{box-sizing:border-box;font-family:Tahoma,Arial}body{margin:0;background:#eef2f7;direction:rtl;color:#111827}.top{background:#20262d;color:white;padding:14px 22px;border-bottom:4px solid #1F4E79;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;border:1px solid #64748b;border-radius:10px;padding:8px 12px}.wrap{padding:22px;max-width:1500px;margin:auto}.panel{background:#fff;border:1px solid #d8dee9;border-radius:16px;box-shadow:0 10px 28px #0001;margin-bottom:16px;overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;gap:10px;align-items:center}.body{padding:16px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}label{font-weight:800;color:#475569;font-size:12px}input,select{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:9px}.btn{border:0;border-radius:10px;padding:10px 13px;background:#1F4E79;color:#fff;font-weight:800;cursor:pointer;margin:3px}.green{background:#16a34a}.orange{background:#f97316}.red{background:#dc2626}.gray{background:#e5e7eb;color:#111827}.table{width:100%;border-collapse:collapse;min-width:1000px}.table th{background:#111827;color:#fff;padding:9px}.table td{border:1px solid #e5e7eb;padding:8px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px}.num{font-size:28px;color:#1F4E79;font-weight:bold}.scroll{overflow:auto}.overdue{background:#fef2f2}.muted{color:#64748b;font-size:13px}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:99}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:12px}.table{min-width:850px}}</style>
</head><body>
<div class="top"><b>⏱️ تقرير البريكات</b><div><a href="/admin-desk">Admin Desk</a></div></div>
<div class="wrap">
  <div class="panel"><div class="head"><div><b>البريكات النشطة الآن</b><div class="muted">محسوبة من السيرفر، وبإمكان الأدمن إنهاء أي بريك نشط.</div></div><button class="btn" onclick="loadActive()">تحديث</button></div><div class="body scroll" id="activeBox">جاري التحميل...</div></div>
  <div class="panel"><div class="head"><b>الفلاتر</b></div><div class="body"><div class="grid"><div><label>من تاريخ</label><input type="date" id="df"></div><div><label>إلى تاريخ</label><input type="date" id="dt"></div><div><label>من ساعة</label><input id="st" value="00:00"></div><div><label>إلى ساعة</label><input id="et" value="23:59"></div><div><label>الموظف</label><select id="emp"></select></div><div><label>الحالة</label><select id="status"><option>All</option><option>active</option><option>finished</option><option>Completed</option></select></div></div><br><button class="btn green" onclick="load()">تحديث</button><button class="btn orange" onclick="window.print()">طباعة/PDF</button><button class="btn" onclick="csv()">CSV Excel</button></div></div>
  <div class="cards"><div class="card">إجمالي البريكات<div class="num" id="total">0</div></div><div class="card">إجمالي الدقائق<div class="num" id="mins">0</div></div></div><br>
  <div class="panel"><div class="head"><b>ملخص الموظفين</b></div><div class="body scroll"><table class="table"><thead><tr><th>الموظف</th><th>عدد</th><th>الدقائق</th></tr></thead><tbody id="byemp"></tbody></table></div></div>
  <div class="panel"><div class="head"><b>تفاصيل البريكات</b></div><div class="body scroll"><table class="table"><thead><tr><th>رقم</th><th>الموظف</th><th>النوع</th><th>الحالة</th><th>بداية</th><th>نهاية</th><th>الدقائق</th><th>التحويلة</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div><div id="toast" class="toast"></div>
<script>
let last=null;function M(a){return a.join('')}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}async function api(m,args){let qs=new URLSearchParams();args=args||{};Object.keys(args).forEach(k=>{if(args[k]!==undefined&&args[k]!==null&&args[k]!=="")qs.append(k,args[k])});let r=await fetch('/api/method/'+m+(qs.toString()?'?'+qs.toString():''),{method:'GET',credentials:'same-origin',cache:'no-store'});let j=await r.json();if(j.exc)throw j;return j.message||j}function today(){return new Date().toISOString().slice(0,10)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadActive(){try{let d=await api('restaurant_ops.api.break_api.get_active_breaks');let box=document.getElementById('activeBox');let rows=d.rows||[];if(!rows.length){box.innerHTML='<div class="muted" style="text-align:center;padding:14px;background:#f8fafc;border-radius:10px">لا توجد بريكات نشطة حالياً</div>';return}box.innerHTML='<div style="margin-bottom:8px"><b>الإجمالي: '+(d.active_count||rows.length)+'</b> | <b style="color:#dc2626">عدت الوقت: '+(d.overdue_count||0)+'</b> | <span class="muted">آخر تحديث: '+esc(d.server_now||'')+'</span></div><table class="table"><thead><tr><th>الموظف</th><th>نوع البريك</th><th>بدأ من</th><th>المدة</th><th>الحد</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>'+rows.map(r=>'<tr class="'+(r.overdue?'overdue':'')+'"><td>'+esc(r.employee_name||r.employee)+'</td><td>'+esc(r.break_type)+'</td><td>'+esc(r.start_time)+'</td><td><b>'+esc(r.duration_minutes)+' دقيقة</b></td><td>'+esc(r.limit_minutes)+' دقيقة</td><td>'+(r.overdue?'⚠️ عدى الوقت بـ '+esc(r.overdue_minutes)+' دقيقة':'داخل الوقت')+'</td><td><button class="btn red" onclick="endBreak(\''+esc(r.name)+'\')">إنهاء البريك</button></td></tr>').join('')+'</tbody></table>'}catch(e){console.error(e);activeBox.innerHTML='<div style="color:#b91c1c;background:#fef2f2;padding:14px;border-radius:10px">فشل تحميل البريكات النشطة</div>'}}
async function endBreak(name){if(!confirm('تأكيد إنهاء البريك؟'))return;let r=await api('restaurant_ops.api.break_api.admin_end_break',{break_log:name});if(r&&r.success){toast(r.message||'تم إنهاء البريك');loadActive();load()}else toast('فشل إنهاء البريك')}
async function emps(){let d=await api(M(['restaurant','_ops.api.ops_reports','_api.list_employees']));emp.innerHTML='<option value="">الكل</option>'+((d&&d.employees)||[]).map(e=>'<option value="'+e.name+'">'+e.employee_name+'</option>').join('')}async function load(){last=await api(M(['restaurant','_ops.api.ops_reports','_api.get_break_report']),{date_from:df.value,date_to:dt.value,start_time:st.value,end_time:et.value,employee:emp.value,status:status.value});if(!last||!last.success){alert((last&&last.message)||'Error');return}total.textContent=last.summary.total_breaks;mins.textContent=last.summary.total_minutes;byemp.innerHTML=last.by_employee.map(x=>'<tr><td>'+esc(x.employee_name)+'</td><td>'+x.count+'</td><td>'+x.minutes+'</td></tr>').join('');rows.innerHTML=last.rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.employee_name||r.employee)+'</td><td>'+esc(r.break_type)+'</td><td>'+esc(r.status)+'</td><td>'+esc(r.start_time_text)+'</td><td>'+esc(r.end_time_text)+'</td><td>'+esc(r.duration_minutes_calc)+'</td><td>'+esc(r.extension_at_start||'')+'</td></tr>').join('')}function csv(){if(!last)return;let blob=new Blob(['\ufeff'+(last.csv||'')],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='break-report.csv';a.click()}df.value=today();dt.value=today();emps().then(()=>{load();loadActive()});setInterval(loadActive,10000);
</script>
</body></html>
